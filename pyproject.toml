[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robinhood-ai-quant"
version = "4.7.3"
description = "Broker-independent AI-assisted quantitative research platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<22",
  "PyYAML>=6.0.1,<7",
  "python-dotenv>=1.0.1,<2",
  "requests>=2.32,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
dashboard = [
  "streamlit>=1.36,<2",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6.0.12",
  "types-requests>=2.32",
]

[project.scripts]
quant-platform = "src.main:main"
atlas-research = "scripts.atlas_v2_research_intelligence:main"
atlas-universe = "scripts.atlas_v2_1_universe_intelligence:main"
atlas-market = "scripts.atlas_v2_2_market_intelligence:main"
atlas-history = "scripts.atlas_v2_2_1_history:main"
atlas-rank = "scripts.atlas_v3_alpha_ranking:main"
atlas-portfolio = "scripts.atlas_v4_portfolio:main"
atlas-metadata = "scripts.atlas_v4_metadata:main"
atlas-institutional = "scripts.atlas_v4_institutional:main"

[tool.setuptools]
packages = [
  "src",
  "scripts",
  "src.ai",
  "src.atlas",
  "src.atlas.factors",
  "src.atlas.features",
  "src.atlas.ranking",
  "src.atlas.portfolio",
  "src.analytics",
  "src.backtest",
  "src.common",
  "src.control_center",
  "src.core",
  "src.data",
  "src.data.providers",
  "src.execution",
  "src.execution_costs",
  "src.feature_intelligence",
  "src.intelligence",
  "src.monitoring",
  "src.portfolio",
  "src.paper_trading",
  "src.reporting",
  "src.runtime",
  "src.session",
  "src.operations",
  "src.research_lab",
  "src.research",
  "src.research.phase7",
  "src.research.phase8",
  "src.research.phase9",
  "src.research.phase10",
  "src.research.phase11",
  "src.research.phase12",
  "src.research.phase13",
  "src.research.phase14",
  "src.research.phase15",
  "src.research.phase16",
  "src.research.phase17",
  "src.research.phase18",
  "src.risk",
  "src.strategies",
  "src.strategy_intelligence",
  "src.alpha_engine",
  "src.microstructure",
  "src.paper_analytics",
  "src.research_journal",
  "src.strategy_lab",
  "src.regime_intelligence",
  "src.continuous_portfolio",
  "src.trading_orchestrator",
  "src.promotion_governance",
  "src.production_safety",
  "src.portfolio_optimizer",
  "src.feature_store",
  "src.ml_platform",
  "src.model_monitor",
  "src.capital_allocator",
  "src.correlation_engine",
  "src.tax",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", ".venv", "venv", "backup", "data", "logs", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = [
  "^tests/",
  "^\\.venv/",
  "^venv/",
  "^build/",
  "^dist/",
  "^dashboard/",
]
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "sklearn", "sklearn.*", "joblib", "joblib.*"]
ignore_missing_imports = true

